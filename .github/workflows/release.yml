name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Resolve and verify version
        id: version
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          FILE_VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K.+' index.php | tr -d '[:space:]')

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match index.php Version header ($FILE_VERSION)."
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build production zip
        run: |
          STAGE_DIR="$RUNNER_TEMP/jwrdc-ame-styler"
          mkdir -p "$STAGE_DIR"

          cp index.php constants.php activation.php "$STAGE_DIR/"
          cp -r src vendor "$STAGE_DIR/"

          (cd "$RUNNER_TEMP" && zip -r "$GITHUB_WORKSPACE/jwrdc-ame-styler.zip" jwrdc-ame-styler)

      - name: Generate update metadata
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/jwrdc-ame-styler.zip"

          cat > details.json <<EOF
          {
            "name": "JWRDC AME Styler",
            "version": "${{ steps.version.outputs.version }}",
            "download_url": "$DOWNLOAD_URL",
            "last_updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sections": {
              "description": "A plugin to add toggling to Admin Menu Editor plugin."
            }
          }
          EOF

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            jwrdc-ame-styler.zip \
            details.json \
            --clobber
